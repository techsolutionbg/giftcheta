services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-giftcheta}
      MYSQL_USER: ${DB_USERNAME:-giftcheta}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local-root-change-me}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u$$MYSQL_USER", "-p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  phpmyadmin:
    image: phpmyadmin:5-apache
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 32M
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  admin-build:
    image: node:24-alpine
    profiles: [build]
    working_dir: /workspace/admin
    volumes:
      - ./:/workspace
    command: ["npm", "run", "build"]
  admin-dev:
    image: node:24-alpine
    profiles: [dev]
    working_dir: /workspace/admin
    ports:
      - "5173:5173"
    volumes:
      - ./:/workspace
      - admin_node_modules:/workspace/admin/node_modules
    environment:
      API_PROXY_TARGET: http://app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    depends_on:
      - app
    restart: unless-stopped
volumes:
  mysql_data:
  admin_node_modules:
